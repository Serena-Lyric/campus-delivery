name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # These credentials belong only to this fresh, disposable job service.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-service
          POSTGRES_DB: campus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d campus_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://ci:ci-only-service@127.0.0.1:5432/campus_ci?schema=public
      ENABLE_BACKGROUND_JOBS: 'false'
      CAMPUS_TIME_ZONE: Asia/Shanghai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.5.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # test:integration deploys historical migrations (including triggers) and seeds.
      # It must never target a developer's application database.
      - run: pnpm test:integration
      - name: Check migration state and schema drift
        run: |
          pnpm --filter @campus-delivery/api exec prisma migrate status
          pnpm --filter @campus-delivery/api exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Verify repeatable development Seed
        run: pnpm db:seed
